site_name: Django Formwork
site_description: An opinionated UI framework for Django, built on Django forms
site_url: https://oliverhaas.github.io/django-formwork/
repo_url: https://github.com/oliverhaas/django-formwork
repo_name: oliverhaas/django-formwork
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  version:
    provider: mike

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - Cookbook: cookbook.md
  - Reference:
      - Architecture: architecture.md
      - Forms: reference/forms.md
      - Widgets: reference/widgets.md
      - Views: reference/views.md
      - Browser Support: reference/browser-support.md
      - Changelog: reference/changelog.md
