[project]
name = "django-formwork"
version = "0.1.0a2"
description = "An opinionated UI framework for Django, built on Django forms"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.14"
keywords = ["django", "forms", "widgets", "rendering", "htmx"]
authors = [{ name = "Oliver Haas", email = "ohaas@e1plus.de" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 6.0",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = [
  "Django>=6.0,<7",
  "django-filthyfields>=2.2.0",
  "django-iconx>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/oliverhaas/django-formwork"
Documentation = "https://oliverhaas.github.io/django-formwork/"
Repository = "https://github.com/oliverhaas/django-formwork.git"
Changelog = "https://oliverhaas.github.io/django-formwork/reference/changelog/"

[dependency-groups]
dev = [
  "beautifulsoup4==4.15.0",
  "django-stubs==6.1.0",
  "jinja2==3.1.6",
  "mypy==2.3.1",
  "numpy>=2.5.2",
  "pillow>=12.3.0",
  "pre-commit==4.6.2",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "pytest-django==4.14.0",
  "pytest-playwright==0.9.0",
  "pytest-xdist==3.8.0",
  "pytest==9.1.1",
  "ruff==0.16.4",
  "ty==0.0.73",
]
docs = ["mkdocs==1.6.1", "mkdocs-material==9.7.7", "mike==2.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["django_formwork"]
# The wheel ships formwork.css (the Tailwind source). formwork-dist.css is a
# gitignored build artifact (compiled from formwork.css via Tailwind) and is
# not distributed; projects compile formwork.css through their own build.

[tool.hatch.build.targets.sdist]
# formwork-dist.css is a build artifact (compiled from formwork.css via Tailwind).
# It is excluded from sdist by listing only source directories; users building
# from source should run the Tailwind build step themselves.
# Patterns are anchored with a leading slash: unanchored patterns match at any
# depth (gitignore semantics) and once leaked a nested worktree copy of the
# package into the sdist.
include = ["/django_formwork", "/LICENSE", "/README.md"]

[tool.ruff]
target-version = "py314"
line-length = 120
fix = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",  # Conflicts with ruff-format
  "D",       # Docstrings - will add incrementally
  "E501",    # Line length handled by config
  "EM",      # Exception strings inline are fine
  "PLC0415", # Dynamic imports intentional (circular import avoidance)
  "TRY003",  # Long exception messages are helpful for debugging
  "SIM108",  # Ternary not always clearer
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
suppress-none-returning = true

[tool.ruff.lint.per-file-ignores]
"examples/**" = [
  "ANN",    # Type annotations not required in examples
  "EXE001", # Shebang on manage.py is conventional
  "RUF005", # List concatenation is clearer in Django choices
  "RUF012", # Mutable class defaults are standard Django patterns (Meta, choices)
  "S105",   # Hardcoded secret key is intentional (example only)
]
"examples/**/migrations/**" = [
  "ARG001", # RunPython hooks take (apps, schema_editor) whether used or not
]
"examples/**/test_*.py" = [
  "ARG",     # Unused arguments common in fixtures
  "PLR2004", # Magic values in assertions are fine
  "S101",    # assert in tests
  "S106",    # Hardcoded demo passwords in test data
  "SLF001",  # Private member access okay to inspect model _meta
]
"tests/**" = [
  "ANN",     # Type annotations not required in tests
  "ARG",     # Unused arguments common in fixtures
  "F841",    # Unused variables okay in tests
  "PLR2004", # Magic values in assertions are fine
  "PT006",   # Parametrize tuple style is preference
  "PT011",   # Broad pytest.raises okay in some tests
  "PT013",   # pytest import style is preference
  "PT018",   # Compound assertions okay in tests
  "RUF002",  # Unicode in docstrings is fine
  "RUF012",  # Mutable class defaults fine in test Layout classes
  "S101",    # assert in tests
  "S105",    # Hardcoded passwords in test settings
  "SLF001",  # Private member access needed to test internal methods
  "T201",    # print used in benchmarks for output
]

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]
pretty = true
show_error_codes = true
show_error_context = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = false

[tool.django-stubs]
django_settings_module = "tests.settings.mypy"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.analysis]
respect-type-ignore-comments = false

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
# Test files hit Django stub and BeautifulSoup stub limitations (unresolved
# imports via pythonpath, ModelChoiceField.choices union, soup.find() nullability,
# TEMPLATES dict shape, async clean override, etc.).  Suppressing broadly
# because test code is verified by running the tests, not the type checker.
unresolved-attribute = "ignore"
unresolved-import = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-method-override = "ignore"
not-iterable = "ignore"
not-subscriptable = "ignore"
no-matching-overload = "ignore"
unsupported-operator = "ignore"
call-non-callable = "ignore"
unknown-argument = "ignore"

[[tool.ty.overrides]]
include = ["examples/**"]

[tool.ty.overrides.rules]
# Example apps hit Django stub limitations (choices type, settings, etc.).
invalid-argument-type = "ignore"
unresolved-import = "ignore"

[[tool.ty.overrides]]
include = ["django_formwork/async_forms.py"]

[tool.ty.overrides.rules]
# Mixin classes reference attributes from cooperating Form/ModelForm base classes.
unresolved-attribute = "ignore"

[[tool.ty.overrides]]
include = ["django_formwork/formsets.py"]

[tool.ty.overrides.rules]
# _BatchedUniquenessMixin reaches the cooperating BaseModelFormSet /
# BaseInlineFormSet base via super() (super()._construct_form,
# super().validate_unique); and unique-check field names always resolve to
# concrete fields with `attname`, which the Django stub widens to
# Field | ForeignObjectRel.
unresolved-attribute = "ignore"

[[tool.ty.overrides]]
include = ["django_formwork/fields.py"]

[tool.ty.overrides.rules]
# FormworkModelChoiceIterator.choice() uses Any-typed local for field access;
# method-shadowing pattern (self.label_from_instance = callable) is intentional;
# label_from_instance(obj: Model) overrides generic _M from django stubs.
unresolved-attribute = "ignore"
invalid-assignment = "ignore"
invalid-method-override = "ignore"

[[tool.ty.overrides]]
include = ["django_formwork/forms.py"]

[tool.ty.overrides.rules]
# FormworkModelFormMetaclass.__new__ accesses cls.base_fields which ty can't
# resolve through the metaclass return type.
# _DirtyOnlyModelFormMixin passes `self` (a bare mixin) to construct_instance
# (which expects BaseForm); the mixin is only ever composed into one at runtime.
unresolved-attribute = "ignore"
invalid-assignment = "ignore"
invalid-argument-type = "ignore"

[[tool.ty.overrides]]
include = ["django_formwork/renderers.py"]

[tool.ty.overrides.rules]
# Django's Jinja2 renderer uses cached_property for backend/engine; type stubs
# expose them as property, causing false positives on operator, type-form, and
# assignment checks.
unsupported-operator = "ignore"
invalid-type-form = "ignore"
invalid-assignment = "ignore"

[[tool.ty.overrides]]
include = ["django_formwork/widgets/*.py"]

[tool.ty.overrides.rules]
# _DropZoneMixin uses super().get_context() which resolves at runtime via MRO
# but ty can't see the cooperative base class.
# PhoneInput.value_from_datadict returns str instead of list[Any] (intentional override).
unresolved-attribute = "ignore"
invalid-method-override = "ignore"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "settings.base"
addopts = "--cov=django_formwork --cov-report=term-missing --cov-report=xml --no-cov-on-fail -n auto"
pythonpath = ["tests"]
testpaths = ["tests"]
xfail_strict = true
markers = [
  "unit: fast, isolated unit tests (widget object, rendering)",
  "integration: widget + form + template integration tests",
  "e2e: browser-based end-to-end tests with live_server",
  "screenshot: visual regression tests with Playwright snapshots",
  "benchmark: performance benchmarks (excluded from normal test runs)",
]

[tool.coverage.run]
omit = ["tests/*"]

[tool.coverage.report]
precision = 2
skip_covered = true
fail_under = 90
