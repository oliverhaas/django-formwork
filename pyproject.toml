[project]
name = "django-formwork"
version = "0.1.0a1"
description = "Better Django forms — modern styling out of the box, then HTMX integration for dynamic behavior"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.12"
keywords = ["django", "forms", "widgets", "rendering", "htmx"]
authors = [{ name = "Oliver Haas", email = "ohaas@e1plus.de" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = ["Django>=5.2,<7"]

[project.urls]
Homepage = "https://github.com/oliverhaas/django-formwork"
Documentation = "https://oliverhaas.github.io/django-formwork/"
Repository = "https://github.com/oliverhaas/django-formwork.git"
Changelog = "https://oliverhaas.github.io/django-formwork/reference/changelog/"

[dependency-groups]
dev = [
  "beautifulsoup4==4.14.3",
  "django-stubs==6.0.1",
  "mypy==1.19.1",
  "pre-commit==4.5.1",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.1.0",
  "pytest-django==4.12.0",
  "percy-playwright==1.0.2",
  "pytest-playwright==0.7.2",
  "pytest-xdist==3.8.0",
  "pytest==9.0.2",
  "ruff==0.15.8",
  "ty==0.0.26",
]
docs = ["mkdocs==1.6.1", "mkdocs-material==9.7.6", "mike==2.1.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["django_formwork"]

[tool.hatch.build.targets.sdist]
include = ["django_formwork", "LICENSE", "README.md"]

[tool.ruff]
target-version = "py313"
line-length = 120
fix = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",  # Conflicts with ruff-format
  "D",       # Docstrings - will add incrementally
  "E501",    # Line length handled by config
  "EM",      # Exception strings inline are fine
  "PLC0415", # Dynamic imports intentional (circular import avoidance)
  "TRY003",  # Long exception messages are helpful for debugging
  "SIM108",  # Ternary not always clearer
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
suppress-none-returning = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "ANN",     # Type annotations not required in tests
  "ARG",     # Unused arguments common in fixtures
  "F841",    # Unused variables okay in tests
  "PLR2004", # Magic values in assertions are fine
  "PT006",   # Parametrize tuple style is preference
  "PT011",   # Broad pytest.raises okay in some tests
  "PT013",   # pytest import style is preference
  "PT018",   # Compound assertions okay in tests
  "RUF002",  # Unicode in docstrings is fine
  "RUF012",  # Mutable class defaults fine in test Layout classes
  "S101",    # assert in tests
  "S105",    # Hardcoded passwords in test settings
]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
pretty = true
show_error_codes = true
show_error_context = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = false

[tool.django-stubs]
django_settings_module = "tests.settings.mypy"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.analysis]
respect-type-ignore-comments = false

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "settings.base"
addopts = "--cov=django_formwork --cov-report=term-missing --cov-report=xml --no-cov-on-fail"
pythonpath = ["tests"]
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
omit = ["tests/*"]

[tool.coverage.report]
precision = 2
skip_covered = true
