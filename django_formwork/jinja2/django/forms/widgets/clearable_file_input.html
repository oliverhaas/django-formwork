{% if widget.is_initial %}<div class="clearable-file-info">
  <div>{{ widget.initial_text }}: <a href="{{ widget.value.url }}" class="link link-primary">{{ widget.value }}</a></div>
  {% if not widget.required %}<label class="clearable-file-clear"><input type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}"{% if widget.attrs.disabled %} disabled{% endif %}{% if widget.attrs.checked %} checked{% endif %}> {{ widget.clear_checkbox_label }}</label>{% endif %}
  <div>{{ widget.input_text }}:</div>
</div>{% endif %}
<input type="{{ widget.type }}" name="{{ widget.name }}"{% include "django/forms/widgets/attrs.html" %}>
