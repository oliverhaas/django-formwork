{# Big choice cards: radio/checkbox choices rendered as large, full-width selectable cards. #}
<div class="big-choice"{% if widget.attrs.id %} id="{{ widget.attrs.id }}"{% endif %}{% if widget.aria_invalid %} data-invalid="{{ widget.aria_invalid }}"{% endif %}>
  {% for group, options, index in widget.optgroups %}{% for option in options %}<label class="big-choice-card"{% if option.attrs.id %} for="{{ option.attrs.id }}"{% endif %}>
    <input type="{{ option.type }}" name="{{ option.name }}" value="{{ option.value|string }}"{% if option.attrs.id %} id="{{ option.attrs.id }}"{% endif %}{% if option.selected %} checked{% endif %}{% if option.attrs.disabled %} disabled{% endif %}>
    <span class="big-choice-label">{{ option.label }}</span>
  </label>{% endfor %}{% endfor %}
</div>
