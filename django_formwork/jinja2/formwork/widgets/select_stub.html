{% set placeholder = widget.trigger_placeholder or _("Select…") %}<details class="dropdown formwork-select"{% if widget.attrs.id %} id="{{ widget.attrs.id }}_wrapper"{% endif %} data-formwork-stub="{{ widget.stub_url }}">
  <summary{% if widget.attrs.id %} id="{{ widget.attrs.id }}"{% endif %} class="text-left{% if widget.attrs.class %} {{ widget.attrs.class }}{% endif %}{% if not widget.selected_label or not widget.value %} formwork-placeholder{% endif %}{% if widget.selected_toggle_class %} {{ widget.selected_toggle_class }}{% endif %}"{% if widget.aria_labelledby %} aria-labelledby="{{ widget.aria_labelledby }}"{% endif %}{% if widget.aria_label %} aria-label="{{ widget.aria_label }}"{% endif %}{% if widget.aria_describedby %} aria-describedby="{{ widget.aria_describedby }}"{% endif %} aria-haspopup="listbox"{% if widget.disabled %} aria-disabled="true" tabindex="-1"{% endif %}{% if widget.aria_invalid %} aria-invalid="{{ widget.aria_invalid }}"{% endif %}{% if widget.aria_required %} aria-required="{{ widget.aria_required }}"{% endif %}{% for name, value in widget.trigger_attrs.items() %}{% if value is not false %} {{ name }}{% if value is not true %}="{{ value }}"{% endif %}{% endif %}{% endfor %}>
    {% if widget.selected_icon %}<span class="shrink-0">{{ widget.selected_icon }}</span>{% endif %}
    <span class="formwork-autowidth-stack"><span><span>{{ widget.selected_label_html or widget.selected_label or placeholder }}</span></span><span class="formwork-autowidth" aria-hidden="true">{{ widget.autowidth_copy }}</span></span>
  </summary>
  <input type="hidden" name="{{ widget.name }}" value="{{ widget.value }}"{% if widget.attrs.id %} id="{{ widget.attrs.id }}_value"{% endif %}{% if widget.disabled %} disabled{% endif %}{% for name, value in widget.input_attrs.items() %}{% if value is not false %} {{ name }}{% if value is not true %}="{{ value }}"{% endif %}{% endif %}{% endfor %}>
</details>
