<div class="date-picker"{% if widget.attrs.id %} id="{{ widget.attrs.id }}_datepicker"{% endif %} data-formwork-stub="{{ widget.stub_url }}">
  <div class="date-picker-label">
    <span class="date-picker-part"><span class="date-picker-sizer" aria-hidden="true">{% for text in widget.sizing_texts %}<span>{{ text }}</span>{% endfor %}</span><input type="{{ widget.type }}" name="{{ widget.name }}" value="{{ widget.value|default('', true) }}"{% include "django/forms/widgets/attrs.html" %} autocomplete="off" class="date-picker-input{% if widget.extra_class %} {{ widget.extra_class }}{% endif %}"></span>
    <button type="button" class="date-picker-toggle" aria-label="{{ _('Open calendar') }}">
      <i class="icon icon-calendar size-4" aria-hidden="true"></i>
    </button>
  </div>
</div>
