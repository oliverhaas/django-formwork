<div class="rating"{% if widget.attrs.id %} id="{{ widget.attrs.id }}"{% endif %}>{% if widget.allow_clear %}<input type="radio" name="{{ widget.name }}" class="rating-hidden" value="" aria-label="{{ _('Clear rating') }}"{% if not widget.value[0] %} checked{% endif %}{% if widget.attrs.disabled %} disabled{% endif %}>{% endif %}{% for group, options, index in widget.optgroups %}{% for option in options %}<input type="radio" name="{{ option.name }}" value="{{ option.value }}" class="mask {{ widget.star_class }}{% if option.css_class %} {{ option.css_class }}{% endif %}" aria-label="{{ option.label }}"{% with widget = option %}{% include "django/forms/widgets/attrs.html" %}{% endwith %}>{% endfor %}{% endfor %}</div>
