<div class="date-range-picker"{% if widget.attrs.id %} id="{{ widget.attrs.id }}_rangepicker"{% endif %} data-formwork-stub="{{ widget.stub_url }}">
  <div class="date-range-field formwork-input{% if widget.attrs.class %} {{ widget.attrs.class }}{% endif %}" role="group"{% if widget.labelledby %} aria-labelledby="{{ widget.labelledby }}"{% endif %}{% if widget.choice_label %} data-choice-shown{% endif %}>
    <span class="date-range-part"><span class="date-range-sizer" aria-hidden="true">{% for text in widget.sizing_texts %}<span>{{ text }}</span>{% endfor %}</span><input type="text" class="date-range-input"{% if widget.attrs.id %} id="{{ widget.attrs.id }}"{% endif %} value="{{ widget.start_text }}" placeholder="{{ widget.choice_label or widget.start_placeholder }}" aria-label="{{ widget.start_placeholder }}" aria-haspopup="dialog" autocomplete="off"{% if widget.disabled %} disabled{% endif %}{% for name, value in widget.part_attrs.items() %}{% if value is not false %} {{ name }}{% if value is not true %}="{{ value }}"{% endif %}{% endif %}{% endfor %}{% for name, value in widget.start_attrs.items() %}{% if value is not false %} {{ name }}{% if value is not true %}="{{ value }}"{% endif %}{% endif %}{% endfor %}></span>
    <span class="date-range-dash shrink-0 opacity-50" aria-hidden="true">&#8211;</span>
    <span class="date-range-part"><span class="date-range-sizer" aria-hidden="true">{% for text in widget.sizing_texts %}<span>{{ text }}</span>{% endfor %}</span><input type="text" class="date-range-input"{% if widget.attrs.id %} id="{{ widget.attrs.id }}_end"{% endif %} value="{{ widget.end_text }}" placeholder="{% if not widget.choice_label %}{{ widget.end_placeholder }}{% endif %}" aria-label="{{ widget.end_placeholder }}" aria-haspopup="dialog" autocomplete="off"{% if widget.disabled %} disabled{% endif %}{% for name, value in widget.part_attrs.items() %}{% if value is not false %} {{ name }}{% if value is not true %}="{{ value }}"{% endif %}{% endif %}{% endfor %}></span>
    <i class="icon icon-calendar-range size-[calc(1em/0.875)] ms-auto shrink-0 opacity-60" aria-hidden="true"></i>
  </div>
  {% with start = widget.subwidgets[0], end = widget.subwidgets[1] %}<input type="hidden" name="{{ start.name }}" value="{{ widget.start }}"{% if start.attrs.id %} id="{{ start.attrs.id }}"{% endif %}{% if widget.disabled %} disabled{% endif %}>
  <input type="hidden" name="{{ end.name }}" value="{{ widget.end }}"{% if end.attrs.id %} id="{{ end.attrs.id }}"{% endif %}{% if widget.disabled %} disabled{% endif %}{% for name, value in widget.input_attrs.items() %}{% if value is not false %} {{ name }}{% if value is not true %}="{{ value }}"{% endif %}{% endif %}{% endfor %}>{% endwith %}
  {% if widget.choices %}{% with choice = widget.subwidgets[2] %}<input type="hidden" name="{{ choice.name }}" value="{{ widget.choice }}"{% if choice.attrs.id %} id="{{ choice.attrs.id }}"{% endif %}{% if widget.disabled %} disabled{% endif %}>{% endwith %}{% endif %}
</div>
