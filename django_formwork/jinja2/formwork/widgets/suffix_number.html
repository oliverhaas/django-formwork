{% set sizes = widget.attrs.class|size_classes %}<div class="relative formwork-field-font{% if sizes %} {{ sizes }}{% endif %}"><input type="{{ widget.type }}" name="{{ widget.name }}"{% if widget.value is not none %} value="{{ widget.value }}"{% endif %}{% include "django/forms/widgets/attrs.html" %}>{% if widget.prefix %}<span class="absolute inset-y-0 start-3 flex items-center leading-[calc(1.25/0.875)] text-base-content/60 pointer-events-none">{{ widget.prefix }}</span>{% endif %}{% if widget.suffix %}<span class="absolute inset-y-0 end-3 flex items-center text-[calc(0.75em/0.875)] leading-[calc(1/0.75)] text-base-content/60 pointer-events-none">{{ widget.suffix }}</span>{% endif %}</div>
