{% set id = widget.attrs.id %}<label class="password-reveal"{% if id %} id="{{ id }}_wrapper"{% endif %} x-data="{ show: false }">
  <input x-bind:type="show ? 'text' : 'password'" name="{{ widget.name }}"{% if widget.value != None %} value="{{ widget.value|string }}"{% endif %} class="grow"{% for name, value in widget.attrs.items() %}{% if value is not false and name != "class" %} {{ name }}{% if value is not true %}="{{ value|string }}"{% endif %}{% endif %}{% endfor %}>
  <button type="button" class="password-reveal-toggle" x-on:click="show = !show" aria-label="Toggle password visibility">
    <svg x-show="!show" xmlns="http://www.w3.org/2000/svg" class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
    <svg x-show="show" x-cloak xmlns="http://www.w3.org/2000/svg" class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
  </button>
</label>
