{% set sizes = widget.extra_class|size_classes %}<div class="date-picker{% if sizes %} {{ sizes }}{% endif %}" :data-open="open"{% if widget.attrs.id %} id="{{ widget.attrs.id }}_datetimepicker"{% endif %} x-data="formworkDateTimePicker" data-formwork-lazy data-value="{{ widget.iso_value }}" data-first-day="{{ widget.calendar.first_day }}" data-months="1" data-names="{{ widget.calendar.names_json }}" data-formats="{{ widget.calendar.formats_json }}" data-input-formats="{{ widget.calendar.input_formats_json }}" @click.outside="close()" @keydown.escape="onEscape($event)" @focusout="onFocusOut($event)" @mousedown="keepInputFocus($event)">
  <div class="date-picker-label formwork-input" @click="focusInput($event)">
    <span class="date-picker-part"><span class="date-picker-sizer" aria-hidden="true">{% for text in widget.sizing_texts %}<span>{{ text }}</span>{% endfor %}</span><input x-ref="input" type="text" value="{{ widget.text }}"{% include "django/forms/widgets/attrs.html" %} aria-haspopup="dialog" autocomplete="off" @focus="onInputFocus()" @click="show()" @input.stop="onType()" @change.stop="onTypeDone()" @keydown.down="onInputDown($event)" @keydown.enter="onEnter($event)" class="date-picker-input{% if widget.extra_class %} {{ widget.extra_class }}{% endif %}"></span>
    <button type="button" class="date-picker-toggle" @click="toggle()" aria-label="{{ _('Open calendar') }}" :aria-expanded="open"{% if widget.attrs.id %} aria-controls="{{ widget.attrs.id }}_calendar"{% endif %}{% if widget.attrs.disabled %} disabled{% endif %}>
      <i class="icon icon-calendar-clock size-[calc(1em/0.875)]" aria-hidden="true"></i>
    </button>
  </div>
  <input type="hidden" x-ref="value" name="{{ widget.name }}" value="{{ widget.iso_value }}"{% if widget.attrs.disabled %} disabled{% endif %}{% with widget = widget.hidden %}{% include "django/forms/widgets/attrs.html" %}{% endwith %}>
  <div x-ref="panel" popover="manual" x-show="open" x-cloak{% if widget.attrs.id %} id="{{ widget.attrs.id }}_calendar"{% endif %} role="dialog" aria-label="{{ _('Calendar') }}" class="dropdown-content calendar-panel bg-base-100 rounded-box shadow-lg border border-base-300">
    {% with calendar = widget.calendar %}{% include "formwork/widgets/partials/calendar.html" %}{% endwith %}
    <div class="calendar-times">
      <label class="calendar-time"><span>{{ _("Time") }}</span><input type="time" class="input input-sm" x-model="time" @input.stop @change.stop="onTimeChange()" @keydown.enter.prevent="done()"></label>
    </div>
    <div class="calendar-footer">
      <button type="button" class="btn btn-ghost btn-sm" @click="pickNow()">{{ _("Now") }}</button>
      <button type="button" class="btn btn-ghost btn-sm" @click="clear()">{{ _("Clear") }}</button>
      <button type="button" class="btn btn-primary btn-sm ms-auto" :disabled="!picked" @click="done()">{{ _("Done") }}</button>
    </div>
  </div>
</div>
