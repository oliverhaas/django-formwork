<div class="dropzone"{% if widget.attrs.id %} id="{{ widget.attrs.id }}_dropzone"{% endif %} x-data="formworkFileDropzone"{% if widget.max_size %} data-max-size="{{ widget.max_size }}"{% endif %} data-type-error="{{ _('File type not accepted') }}" data-size-error="{{ _('File too large') }}" data-count-text="{{ widget.count_text }}" data-file-icons="{{ widget.file_icons }}" @dragover.prevent="onDragOver()" @dragleave.prevent="onDragLeave()" @drop.prevent="drop($event)">
  <div class="dropzone-area" :class="dragClass">
    <input x-ref="input" type="file" name="{{ widget.name }}" class="sr-only" @change="onChange()"{% for name, value in widget.attrs.items() %}{% if value is not false and name != "class" %} {{ name }}{% if value is not true %}="{{ value }}"{% endif %}{% endif %}{% endfor %}>
    <div x-show="!files.length" @click="browse()">
      <i class="icon icon-cloud-upload dropzone-prompt-icon" aria-hidden="true"></i>
      <p class="dropzone-prompt-text">{{ _("Drag and drop files here") }} <span class="dropzone-browse">{{ _("or browse") }}</span></p>
      {% if widget.accept_display or widget.max_size_display %}<p class="dropzone-accept-text">{{ widget.accept_display }}{% if widget.accept_display and widget.max_size_display %} · {% endif %}{{ widget.max_size_text }}</p>{% endif %}
    </div>
    <div x-show="files.length" x-cloak class="dropzone-preview-area">
      <button type="button" class="dropzone-remove" @click.stop="clear()" aria-label="{{ _('Remove file') }}"><i class="icon icon-x dropzone-remove-icon" aria-hidden="true"></i></button>
      <div class="dropzone-file-preview" @click="browse()">
        <i class="icon dropzone-file-icon" :class="fileIcon" aria-hidden="true"></i>
        <p class="dropzone-file-name" x-text="summary"></p>
        <p class="dropzone-file-size" x-text="details"></p>
      </div>
    </div>
    <p x-show="error" x-text="error" x-cloak role="alert" class="dropzone-error"></p>
  </div>
</div>
