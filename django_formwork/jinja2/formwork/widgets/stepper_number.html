{% macro input() %}<input type="{{ widget.type }}" x-ref="input" @change="onChange()" name="{{ widget.name }}" class="input-stepper{% if widget.trailing_buttons %} px-3 text-start{% endif %}{% if widget.css_class %} {{ widget.css_class }}{% endif %}"{% if widget.value is not none %} value="{{ widget.value }}"{% endif %}{% include "django/forms/widgets/attrs.html" %}>{% endmacro %}
<div x-data="formworkStepperNumber"{% if widget.min is not none %} data-min="{{ widget.min }}"{% endif %} data-integer="{{ 'true' if widget.integer else 'false' }}">
  {% if widget.trailing_buttons %}<div class="flex gap-2">{{ input() }}<button type="button" class="btn btn-square btn-outline btn-neutral shrink-0" @click="step(-1)" tabindex="-1" aria-label="{{ _('Decrease') }}"{% if widget.attrs.disabled %} disabled{% endif %}><i class="icon icon-minus text-xs" aria-hidden="true"></i></button><button type="button" class="btn btn-square btn-outline btn-neutral shrink-0" @click="step(1)" tabindex="-1" aria-label="{{ _('Increase') }}"{% if widget.attrs.disabled %} disabled{% endif %}><i class="icon icon-plus text-xs" aria-hidden="true"></i></button></div>
  {% else %}<div class="relative flex z-0">{{ input() }}<button type="button" class="input-stepper-button start-3{% if widget.attrs.disabled %} invisible{% endif %}" @click="step(-1)" tabindex="-1" aria-label="{{ _('Decrease') }}"><i class="icon icon-minus text-xs" aria-hidden="true"></i></button><button type="button" class="input-stepper-button end-3{% if widget.attrs.disabled %} invisible{% endif %}" @click="step(1)" tabindex="-1" aria-label="{{ _('Increase') }}"><i class="icon icon-plus text-xs" aria-hidden="true"></i></button></div>
  {% endif %}
</div>
