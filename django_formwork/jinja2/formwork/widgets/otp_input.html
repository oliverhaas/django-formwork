{% set id = widget.attrs.id %}<div class="otp-input"{% if id %} id="{{ id }}_otp"{% endif %} x-data="{
  digits: [{% for d in widget.initial_digits %}'{{ d }}'{% if not loop.last %}, {% endif %}{% endfor %}],
  get combined() { return this.digits.join(''); },
  handleInput(i, e) {
    const v = e.target.value.slice(-1);
    this.digits[i] = v;
    if (v && i < this.digits.length - 1) this.$refs['d' + (i + 1)].focus();
    this.$refs.hidden.value = this.combined;
    this.$refs.hidden.dispatchEvent(new Event('input', {bubbles: true}));
  },
  handleKey(i, e) {
    if (e.key === 'Backspace' && !this.digits[i] && i > 0) {
      this.$refs['d' + (i - 1)].focus();
    }
  },
  handlePaste(e) {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text').slice(0, this.digits.length);
    for (let i = 0; i < text.length; i++) { this.digits[i] = text[i]; }
    const next = Math.min(text.length, this.digits.length - 1);
    this.$refs['d' + next].focus();
    this.$refs.hidden.value = this.combined;
  }
}">
  <input x-ref="hidden" type="hidden" name="{{ widget.name }}" :value="combined"{% if id %} id="{{ id }}"{% endif %}>
  <div class="otp-boxes">
    {% for i in widget.digits %}<input x-ref="d{{ i }}" type="text" inputmode="numeric" maxlength="1" class="otp-digit" :value="digits[{{ i }}]" @input="handleInput({{ i }}, $event)" @keydown="handleKey({{ i }}, $event)" @paste="handlePaste($event)" @focus="$el.select()" autocomplete="one-time-code">{% endfor %}
  </div>
</div>
