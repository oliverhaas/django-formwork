<div class="otp-input"{% if widget.attrs.id %} id="{{ widget.attrs.id }}_otp"{% endif %} x-data="formworkOtpInput" data-digits="{{ widget.initial_digits_json }}">
  <input x-ref="hidden" type="hidden" name="{{ widget.name }}" :value="combined"{% if widget.attrs.id %} id="{{ widget.attrs.id }}"{% endif %}>
  <div class="otp-boxes">
    {% for i in widget.digits %}<input x-ref="d{{ i }}" type="text" inputmode="numeric" maxlength="1" class="otp-digit" aria-label="Digit {{ forloop.counter }} of {{ widget.length }}" :value="digits[{{ i }}]" @input="handleInput({{ i }}, $event)" @keydown="handleKey({{ i }}, $event)" @paste="handlePaste($event)" @focus="$el.select()" autocomplete="one-time-code">{% endfor %}
  </div>
</div>
