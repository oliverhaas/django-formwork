<div{% if widget.attrs.id %} id="{{ widget.attrs.id }}"{% endif %} class="flex w-full flex-col items-stretch justify-stretch gap-3 lg:flex-row">{% for group, options, index in widget.optgroups %}{% for option in options %}
  <label class="relative flex flex-1 basis-0 cursor-pointer items-center gap-x-4 rounded-box border {% if widget.aria_invalid %}border-error{% else %}border-base-300{% endif %} bg-base-100 px-7 py-8 text-base font-normal text-balance text-base-content/60 shadow-sm has-checked:border-transparent has-checked:bg-primary has-checked:text-primary-content has-checked:shadow-md"><input type="{{ option.type }}" name="{{ option.name }}" value="{{ option.value|stringformat:'s' }}"{% include "django/forms/widgets/attrs.html" with widget=option %}><span class="grow text-center">{{ option.label }}</span></label>{% endfor %}{% endfor %}
</div>
