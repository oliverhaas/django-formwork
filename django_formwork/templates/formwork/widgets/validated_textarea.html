{% load formwork i18n %}{% with id=widget.attrs.id %}{% if widget.validate_url %}<div class="validated-textarea"{% if id %} id="{{ id }}_vtextarea"{% endif %} x-data="formworkValidatedTextarea" data-has-errors="{{ widget.attrs|attr:'aria-invalid'|yesno:'true,false,false' }}">
  <div x-ref="backdrop"{% if id %} id="{{ id }}_highlights"{% endif %} class="validated-textarea-highlights" aria-hidden="true">{% if widget.value %}{{ widget.value }}{% endif %}</div>
  <textarea x-ref="textarea" name="{{ widget.name }}"{% if id %} id="{{ id }}"{% endif %}{% for name, value in widget.attrs.items %}{% if value is not False and name != "id" and name != "aria-invalid" %} {{ name }}{% if value is not True %}="{{ value|stringformat:'s' }}"{% endif %}{% endif %}{% endfor %} :aria-invalid="ariaInvalid" @scroll="syncScroll()"{% if id %} hx-post="{{ widget.validate_url }}" hx-trigger="input changed delay:500ms" hx-target="#{{ id }}_highlights" hx-swap="innerHTML" @htmx:config:request="onValidateConfig($event)" @htmx:after:swap="onValidated()"{% endif %}>{% if widget.value %}{{ widget.value }}{% endif %}</textarea>
  <div class="tooltip tooltip-error tooltip-bottom tooltip-open validated-textarea-tooltip"{% if id %} id="{{ id }}_vttooltip"{% endif %}>
    <div class="validated-textarea-spacer"></div>
    <div x-ref="errors" class="tooltip-content formwork-errors"{% if id %} id="{{ id }}_live_error"{% endif %} role="alert"></div>
  </div>
</div>{% else %}<textarea name="{{ widget.name }}"{% if id %} id="{{ id }}"{% endif %}{% for name, value in widget.attrs.items %}{% if value is not False and name != "id" %} {{ name }}{% if value is not True %}="{{ value|stringformat:'s' }}"{% endif %}{% endif %}{% endfor %}>{% if widget.value %}{{ widget.value }}{% endif %}</textarea>{% endif %}{% endwith %}
