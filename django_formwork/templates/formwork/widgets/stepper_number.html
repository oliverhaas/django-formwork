{% load i18n l10n %}{% partialdef input %}<input type="{{ widget.type }}" x-ref="input" @change="onChange()" name="{{ widget.name }}" class="input-stepper{% if widget.trailing_buttons %} px-3 text-start{% endif %}{% if widget.css_class %} {{ widget.css_class }}{% endif %}"{% if widget.value != None %} value="{{ widget.value|stringformat:'s' }}"{% endif %}{% include "django/forms/widgets/attrs.html" %}>{% endpartialdef %}
<div x-data="formworkStepperNumber"{% if widget.min != None %} data-min="{{ widget.min|unlocalize }}"{% endif %} data-integer="{{ widget.integer|yesno:'true,false' }}">
  {% if widget.trailing_buttons %}<div class="flex gap-2">{% partial input %}<button type="button" class="btn btn-square btn-outline btn-neutral shrink-0" @click="step(-1)" tabindex="-1" aria-label="{% translate 'Decrease' %}"{% if widget.attrs.disabled %} disabled{% endif %}><i class="icon icon-minus text-xs" aria-hidden="true"></i></button><button type="button" class="btn btn-square btn-outline btn-neutral shrink-0" @click="step(1)" tabindex="-1" aria-label="{% translate 'Increase' %}"{% if widget.attrs.disabled %} disabled{% endif %}><i class="icon icon-plus text-xs" aria-hidden="true"></i></button></div>
  {% else %}<div class="relative flex z-0">{% partial input %}<button type="button" class="input-stepper-button start-3{% if widget.attrs.disabled %} invisible{% endif %}" @click="step(-1)" tabindex="-1" aria-label="{% translate 'Decrease' %}"><i class="icon icon-minus text-xs" aria-hidden="true"></i></button><button type="button" class="input-stepper-button end-3{% if widget.attrs.disabled %} invisible{% endif %}" @click="step(1)" tabindex="-1" aria-label="{% translate 'Increase' %}"><i class="icon icon-plus text-xs" aria-hidden="true"></i></button></div>
  {% endif %}
</div>
