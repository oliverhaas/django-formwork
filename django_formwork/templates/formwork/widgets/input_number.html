<div class="input-number"{% if widget.attrs.id %} id="{{ widget.attrs.id }}_stepper"{% endif %} x-data="{
  val: '{{ widget.value|default:''|escapejs }}',
  min: {{ widget.attrs.min|default:'null' }},
  max: {{ widget.attrs.max|default:'null' }},
  step: {{ widget.attrs.step|default:'1' }},
  _num() { const n = Number(this.val); return Number.isFinite(n) ? n : 0; },
  _round(v) { const d = (String(this.step).split('.')[1] || '').length; const f = 10 ** d; return Math.round(v * f) / f; },
  dec() { const v = this._round(this._num() - this.step); this.val = (this.min !== null && v < this.min) ? this.min : v; this.sync(); },
  inc() { const v = this._round(this._num() + this.step); this.val = (this.max !== null && v > this.max) ? this.max : v; this.sync(); },
  sync() { this.$refs.input.value = this.val; this.$refs.input.dispatchEvent(new Event('input', {bubbles: true})); }
}">
  <button type="button" @click="dec()" class="btn" aria-label="Decrease">&minus;</button>
  <input x-ref="input" type="number" name="{{ widget.name }}" :value="val" @input="val = $el.value"{% include "django/forms/widgets/attrs.html" %}>
  <button type="button" @click="inc()" class="btn" aria-label="Increase">&plus;</button>
</div>
