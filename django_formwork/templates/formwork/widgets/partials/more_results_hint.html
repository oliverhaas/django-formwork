{% load i18n %}<div role="status" class="alert alert-info alert-soft m-0.5"><i class="icon icon-info shrink-0" aria-hidden="true"></i><span>{% blocktranslate %}Showing the first {{ shown }} matches. Keep typing to narrow them down.{% endblocktranslate %}</span><button type="button" class="btn btn-sm btn-soft btn-info relative" hx-get="{{ more_url }}" hx-target="closest li" hx-swap="outerHTML" hx-disable="this" @mousedown.prevent><span class="loading loading-spinner loading-xs htmx-indicator absolute" aria-hidden="true"></span><span class="htmx-indicator-inverse">{% translate "Load more" %}</span></button></div>
