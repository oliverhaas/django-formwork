{% load i18n %}<div class="rating"{% if widget.attrs.id %} id="{{ widget.attrs.id }}"{% endif %}>{% if widget.allow_clear %}<input type="radio" name="{{ widget.name }}" class="rating-hidden" value="" aria-label="{% translate 'Clear rating' %}"{% if not widget.value.0 %} checked{% endif %}{% if widget.attrs.disabled %} disabled{% endif %}>{% endif %}{% for group, options, index in widget.optgroups %}{% for option in options %}<input type="radio" name="{{ option.name }}" value="{{ option.value|stringformat:'s' }}" class="mask {{ widget.star_class }}{% if option.css_class %} {{ option.css_class }}{% endif %}" aria-label="{{ option.label }}"{% include "django/forms/widgets/attrs.html" with widget=option %}>{% endfor %}{% endfor %}</div>
