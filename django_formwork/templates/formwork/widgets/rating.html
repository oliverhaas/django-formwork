{% with id=widget.attrs.id %}{% if widget.allow_clear %}<div class="flex items-center gap-1"{% if id %} id="{{ id }}_wrapper"{% endif %}><div class="rating"{% if id %} id="{{ id }}"{% endif %}><input type="radio" name="{{ widget.name }}" class="rating-hidden" value="" aria-label="clear"{% if not widget.value %} checked{% endif %}>{% for group, options, index in widget.optgroups %}{% for option in options %}<input type="radio" name="{{ option.name }}" value="{{ option.value|stringformat:'s' }}" class="mask {{ widget.star_class }}" aria-label="{{ option.label }}"{% if option.attrs.id %} id="{{ option.attrs.id }}"{% endif %}{% if option.selected %} checked{% endif %}{% if option.attrs.disabled %} disabled{% endif %}>{% endfor %}{% endfor %}</div><button type="button" class="rating-clear" onclick="this.previousElementSibling.querySelector('.rating-hidden').checked=true" aria-label="Clear rating">&times;</button></div>{% else %}<div class="rating"{% if id %} id="{{ id }}"{% endif %}>{% for group, options, index in widget.optgroups %}{% for option in options %}<input type="radio" name="{{ option.name }}" value="{{ option.value|stringformat:'s' }}" class="mask {{ widget.star_class }}" aria-label="{{ option.label }}"{% if option.attrs.id %} id="{{ option.attrs.id }}"{% endif %}{% if option.selected %} checked{% endif %}{% if option.attrs.disabled %} disabled{% endif %}>{% endfor %}{% endfor %}</div>{% endif %}{% endwith %}
