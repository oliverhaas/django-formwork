{% with id=widget.attrs.id %}<div class="rating"{% if id %} id="{{ id }}"{% endif %}>{% if widget.allow_clear %}<input type="radio" name="{{ widget.name }}" class="rating-hidden" value="" aria-label="clear"{% if not widget.value %} checked{% endif %}>{% endif %}{% for group, options, index in widget.optgroups %}{% for option in options %}<input type="radio" name="{{ option.name }}" value="{{ option.value|stringformat:'s' }}" class="mask {{ widget.star_class }}" aria-label="{{ option.label }}"{% if option.attrs.id %} id="{{ option.attrs.id }}"{% endif %}{% if option.selected %} checked{% endif %}{% if option.attrs.disabled %} disabled{% endif %}>{% endfor %}{% endfor %}</div>{% endwith %}
