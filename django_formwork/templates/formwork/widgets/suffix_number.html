<div class="relative"><input type="{{ widget.type }}" name="{{ widget.name }}"{% if widget.value != None %} value="{{ widget.value|stringformat:'s' }}"{% endif %}{% include "django/forms/widgets/attrs.html" %}{% if widget.prefix %} style="padding-inline-start: calc(1.25rem + {{ widget.prefix|length }}ch)"{% endif %}>{% if widget.prefix %}<span class="absolute inset-y-0 start-3 flex items-center text-sm text-base-content/60 pointer-events-none">{{ widget.prefix }}</span>{% endif %}{% if widget.suffix %}<span class="absolute inset-y-0 end-3 flex items-center text-xs text-base-content/60 pointer-events-none">{{ widget.suffix }}</span>{% endif %}</div>
