{% load i18n %}<div class="date-picker" :data-open="open"{% if widget.attrs.id %} id="{{ widget.attrs.id }}_datetimepicker"{% endif %} x-data="formworkDateTimePicker" data-formwork-lazy data-value="{{ widget.iso_value }}" data-first-day="{{ widget.calendar.first_day }}" data-months="1" data-names="{{ widget.calendar.names_json }}" data-formats="{{ widget.calendar.formats_json }}" data-input-formats="{{ widget.calendar.input_formats_json }}" @click.outside="close()" @keydown.escape="onEscape($event)" @focusout="onFocusOut($event)" @mousedown="keepInputFocus($event)">
  <div class="date-picker-label" @click="focusInput($event)">
    <input x-ref="input" type="text" value="{{ widget.text }}"{% include "django/forms/widgets/attrs.html" %} aria-haspopup="dialog" autocomplete="off" @focus="onInputFocus()" @click="show()" @input.stop="onType()" @change.stop="onTypeDone()" @keydown.down="onInputDown($event)" @keydown.enter="onEnter($event)" class="grow tabular-nums{% if widget.extra_class %} {{ widget.extra_class }}{% endif %}">
    <button type="button" class="date-picker-toggle" @click="toggle()" aria-label="{% translate 'Open calendar' %}" :aria-expanded="open"{% if widget.attrs.id %} aria-controls="{{ widget.attrs.id }}_calendar"{% endif %}{% if widget.attrs.disabled %} disabled{% endif %}>
      <i class="icon icon-calendar-clock size-4" aria-hidden="true"></i>
    </button>
  </div>
  <input type="hidden" x-ref="value" name="{{ widget.name }}" value="{{ widget.iso_value }}"{% if widget.attrs.disabled %} disabled{% endif %}{% include "django/forms/widgets/attrs.html" with widget=widget.hidden %}>
  <div x-ref="panel" popover="manual" x-show="open" x-cloak{% if widget.attrs.id %} id="{{ widget.attrs.id }}_calendar"{% endif %} role="dialog" aria-label="{% translate 'Calendar' %}" class="dropdown-content calendar-panel bg-base-100 rounded-box shadow-lg border border-base-300">
    {% include "formwork/widgets/partials/calendar.html" with calendar=widget.calendar %}
    <div class="calendar-times">
      <label class="calendar-time"><span>{% translate "Time" %}</span><input type="time" class="input input-sm" x-model="time" @input.stop @change.stop="onTimeChange()" @keydown.enter.prevent="done()"></label>
    </div>
    <div class="calendar-footer">
      <button type="button" class="btn btn-ghost btn-sm" @click="pickNow()">{% translate "Now" %}</button>
      <button type="button" class="btn btn-ghost btn-sm" @click="clear()">{% translate "Clear" %}</button>
      <button type="button" class="btn btn-primary btn-sm ms-auto" :disabled="!picked" @click="done()">{% translate "Done" %}</button>
    </div>
  </div>
</div>
