{% with id=widget.attrs.id %}<div class="image-upload"{% if id %} id="{{ id }}_upload"{% endif %} x-data="{
  preview: null,
  dragging: false,
  loadPreview(file) {
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = (e) => this.preview = e.target.result;
    reader.readAsDataURL(file);
  },
  handleDrop(e) {
    this.dragging = false;
    const file = e.dataTransfer.files[0];
    if (file) {
      this.$refs.input.files = e.dataTransfer.files;
      this.loadPreview(file);
    }
  },
  handleChange(e) {
    const file = e.target.files[0];
    if (file) this.loadPreview(file);
    else this.preview = null;
  },
  clear() {
    this.preview = null;
    this.$refs.input.value = '';
  }
}" @dragover.prevent="dragging = true" @dragleave.prevent="dragging = false" @drop.prevent="handleDrop($event)">
  <div class="image-upload-area" :class="dragging && 'dragging'">
    <input x-ref="input" type="file" name="{{ widget.name }}"{% if id %} id="{{ id }}"{% endif %} @change="handleChange($event)"{% for name, value in widget.attrs.items %}{% if value is not False and name != "class" and name != "id" %} {{ name }}{% if value is not True %}="{{ value|stringformat:'s' }}"{% endif %}{% endif %}{% endfor %}>
    <div x-show="!preview" @click="$refs.input.click()">
      <svg class="image-upload-prompt-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10l-3.1-3.1a2 2 0 0 0-2.814.014L6 21"/><path d="m14 19.5 3-3 3 3"/><path d="M17 22v-5.5"/><circle cx="9" cy="9" r="2"/></svg>
      <p class="image-upload-prompt-text">Drop an image or <span class="image-upload-browse">browse</span></p>
    </div>
    <div x-show="preview" x-cloak class="image-upload-preview-area">
      <img :src="preview" class="image-upload-preview">
      <button type="button" class="image-upload-remove" @click.stop="clear()">Remove</button>
    </div>
  </div>
</div>{% endwith %}
