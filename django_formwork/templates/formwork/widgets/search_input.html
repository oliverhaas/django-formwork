{% load i18n %}<div class="relative group"{% if widget.show_clear or widget.filter_items %} x-data="formworkSearchInput" @input="sync()" @htmx:after:settle.window="sync()"{% endif %}{% if widget.filter_items %} data-filter-items="{{ widget.filter_items }}"{% endif %}>
  <input type="{{ widget.type }}" name="{{ widget.name }}"{% if widget.show_clear or widget.filter_items %} x-ref="input"{% endif %}{% if widget.filter_items %} @keydown.enter.prevent{% endif %}{% if widget.value != None %} value="{{ widget.value|stringformat:'s' }}"{% endif %}{% include "django/forms/widgets/attrs.html" %}>
  <div{% if widget.attrs.id %} id="{{ widget.attrs.id }}_icon"{% endif %} class="pointer-events-none absolute inset-y-0 start-0 flex items-center ps-3.5">{% if widget.show_spinner %}<span class="loading loading-spinner loading-xs htmx-indicator absolute text-primary" aria-hidden="true"></span>{% endif %}<i class="icon icon-search text-base-content/50 group-focus-within:text-base-content{% if widget.show_spinner %} htmx-indicator-inverse{% endif %}" aria-hidden="true"></i></div>
  {% if widget.show_clear %}<button type="button" class="input-icon-button end-2.5 text-base-content/50"{% if not widget.value %} disabled{% endif %} :disabled="empty" @mousedown.prevent @click="clear()" aria-label="{% translate 'Clear search' %}"><i class="icon icon-x" aria-hidden="true"></i></button>{% endif %}
</div>
