{% load i18n %}<div class="flex items-start gap-1" x-data="formworkRelated" data-related="{{ model_label }}" data-name="{{ name }}" data-popup-query="{{ popup_query }}"{% if change_related_template_url %} data-change-url="{{ change_related_template_url }}"{% endif %} @change="syncLink()" @formwork-admin:related="apply($event.detail)">
  <div class="min-w-0{% if not choice_list %} flex-1{% endif %}">{{ rendered_widget }}</div>{% if lookup_url %}
  {% blocktranslate asvar label %}Look up {{ model }}{% endblocktranslate %}<a href="{{ lookup_url }}" class="btn btn-ghost btn-square{% if choice_list %} -my-1.5{% endif %} text-base-content/70" data-related-popup="lookup" @click="open($event)" aria-label="{{ label }}" title="{{ label }}"><i class="icon icon-search" aria-hidden="true"></i></a>{% endif %}
</div>
