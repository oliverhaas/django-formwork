{% load i18n %}<div{% if widget.attrs.id %} id="{{ widget.attrs.id }}"{% endif %} class="flex min-h-10 flex-wrap items-center gap-x-4 gap-y-2 text-sm">
  {% if summary %}<dl class="flex min-w-0 flex-wrap gap-x-4 gap-y-1">{% for key, item in summary %}<div class="flex min-w-0 gap-1.5"><dt class="text-base-content/60">{{ key|capfirst }}</dt><dd class="font-mono text-xs leading-5 break-all">{{ item }}</dd></div>{% endfor %}</dl>
  {% elif error %}<span class="text-error">{{ error }}</span>
  {% else %}<span class="text-base-content/60">{% translate "No password set." %}</span>{% endif %}
  <a role="button" class="btn btn-sm" href="{{ password_url|default:"../password/" }}"><i class="icon icon-key-round" aria-hidden="true"></i>{{ button_label }}</a>
</div>
