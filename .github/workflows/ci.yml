name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run ruff check
        run: uv run ruff check

      - name: Run ruff format check
        run: uv run ruff format --check

      - name: Run mypy check
        run: uv run mypy django_formwork/

      - name: Run ty check
        run: uv run ty check django_formwork/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.14

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Generate iconx CSS
        env:
          DJANGO_SETTINGS_MODULE: settings.base
          PYTHONPATH: tests
        run: uv run python -m django formwork install

      - name: Build CSS bundle for e2e
        run: npx @tailwindcss/cli -i tests/e2e/app.css -o django_formwork/static/formwork/formwork-dist.css

      - name: Run tests
        run: uv run pytest tests/ -m "not screenshot" -n auto

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
