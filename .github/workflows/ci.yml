name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run ruff check
        run: uv run ruff check

      - name: Run ruff format check
        run: uv run ruff format --check

      - name: Run mypy check
        run: uv run mypy django_formwork/

      - name: Run ty check
        run: uv run ty check django_formwork/

  test:
    # Playwright 1.58 cannot install Chromium on Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        django: ["6.0", "6.1"]
    env:
      # Keep `uv run` from syncing the locked Django back over the matrix one.
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.14

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          uv sync --group dev
          uv pip install "django~=${{ matrix.django }}.0"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Install gettext
        run: sudo apt-get install -y gettext

      - name: Generate iconx CSS
        env:
          DJANGO_SETTINGS_MODULE: settings.base
          PYTHONPATH: tests
        run: uv run python -m django formwork install

      - name: Build CSS bundle for e2e
        run: npx @tailwindcss/cli -i tests/e2e/app.css -o django_formwork/static/formwork/formwork-dist.css

      - name: Run tests
        run: uv run pytest tests/ -m "not screenshot and not benchmark" -n auto

      - name: Upload coverage to Codecov
        if: matrix.django == '6.1'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # The ranked search (search_ranked) needs PostgreSQL with pg_trgm; the
  # browser tests stay on SQLite in the test job.
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.14

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Run tests on PostgreSQL
        run: uv run pytest tests/ --ds settings.postgres -m "not screenshot and not benchmark and not e2e" -n auto --no-cov
