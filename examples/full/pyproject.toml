[project]
name = "formwork-example-full"
version = "0.0.0"
description = "django-formwork full example: Taskwork, a small project-management UI"
requires-python = ">=3.14"
dependencies = [
  "Django>=6.0,<7",
  "django-filter>=25",
  "django-formwork",
  "pillow>=11",      # ImageField (cover_image, avatar) needs it
]

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "pytest-django>=4.12,<5",
]

[tool.uv.sources]
django-formwork = { path = "../..", editable = true }

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "taskmanager.settings"
testpaths = ["taskmanager"]
