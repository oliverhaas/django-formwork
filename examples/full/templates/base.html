{% load formwork static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Task Manager{% endblock %}</title>

  <link rel="stylesheet" href="{% static 'dist.css' %}">

  <script src="https://unpkg.com/htmx.org@4.0.0-beta3/dist/htmx.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  {% formwork_js %}
</head>
<body class="min-h-screen bg-base-200">
  <div class="navbar bg-base-100 shadow-sm mb-6">
    <div class="flex-1">
      <a href="{% url 'task_list' %}" class="btn btn-ghost text-xl">Task Manager</a>
    </div>
    <div class="flex-none gap-2">
      <a href="{% url 'task_create' %}" class="btn btn-primary btn-sm">New Task</a>
      <a href="{% url 'wizard' %}" class="btn btn-outline btn-sm">New Project</a>
    </div>
  </div>
  <div class="max-w-4xl mx-auto px-4 pb-8">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
