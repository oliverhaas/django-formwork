{% load formwork %}
<tbody id="task-rows">
{% for t in tasks %}
  {% include "tasks/_list_row.html" with task=t %}
{% empty %}
  <tr>
    <td colspan="8" class="text-center py-12 text-base-content/50">
      <i class="icon icon-inbox size-10 mx-auto mb-2 opacity-40 block"></i>
      No tasks match the current filter.
    </td>
  </tr>
{% endfor %}
</tbody>
