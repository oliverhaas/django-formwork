{% extends "base.html" %}
{% block title %}Tasks — Task Manager{% endblock %}

{% block content %}
<div class="card bg-base-100 shadow-sm">
  <div class="card-body">
    <h2 class="card-title mb-4">Tasks</h2>

    {# Filter form — htmx submits on change, morphs the task list #}
    <form hx-get="{% url 'task_list' %}"
          hx-target="#task-list"
          hx-trigger="input changed delay:300ms, change"
          hx-swap="innerHTML"
          class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
      {{ filter_form }}
    </form>

    <div id="task-list">
      {% include "tasks/task_list_partial.html" %}
    </div>
  </div>
</div>
{% endblock %}
