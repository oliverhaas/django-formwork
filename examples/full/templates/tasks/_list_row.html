<tr id="task-row-{{ task.pk }}">
  <td>
    <span class="size-2 rounded-full bg-{{ task.priority_color }} inline-block" title="{{ task.priority_label }}"></span>
  </td>
  <td class="max-w-xs">
    <a href="{% url 'task_edit' task.pk %}" class="font-medium hover:underline">{{ task.title }}</a>
    {% if task.description %}<p class="text-xs text-base-content/50 truncate">{{ task.description }}</p>{% endif %}
  </td>
  <td>
    <form hx-post="{% url 'task_status' task.pk %}"
          hx-target="#task-row-{{ task.pk }}"
          hx-swap="outerHTML"
          hx-trigger="change">
      {% csrf_token %}
      <select name="status" class="select select-sm select-ghost bg-{{ task.status_color }}/10 text-{{ task.status_color }} font-medium">
        {% for value, label in task.STATUS_CHOICES %}
          <option value="{{ value }}" {% if task.status == value %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </form>
  </td>
  <td>
    <span class="badge badge-{{ task.priority_color }} badge-soft badge-sm">{{ task.priority_label }}</span>
  </td>
  <td class="text-sm">{{ task.assignee|default:"—" }}</td>
  <td>
    <div class="flex flex-wrap gap-1">
      {% for tag in task.tags.all %}
        <span class="badge badge-ghost badge-sm">{{ tag.name }}</span>
      {% empty %}
        <span class="text-base-content/40">—</span>
      {% endfor %}
    </div>
  </td>
  <td class="text-sm whitespace-nowrap">{{ task.due_date|default:"—" }}</td>
  <td>
    <div class="dropdown dropdown-end">
      <button tabindex="0" class="btn btn-ghost btn-xs" aria-label="actions">
        <i class="icon icon-ellipsis-vertical size-4"></i>
      </button>
      <ul tabindex="0" class="dropdown-content menu menu-sm bg-base-100 rounded-box shadow-lg border border-base-300 w-36 p-1 z-10">
        <li><a href="{% url 'task_edit' task.pk %}"><i class="icon icon-pencil size-4"></i> Edit</a></li>
        <li><a href="{% url 'task_delete' task.pk %}" class="text-error"><i class="icon icon-trash-2 size-4"></i> Delete</a></li>
      </ul>
    </div>
  </td>
</tr>
