[project]
name = "formwork-example-simple"
version = "0.0.0"
description = "django-formwork simple example: one form, standard and custom widgets"
requires-python = ">=3.14"
dependencies = [
  "Django>=6.0,<7",
  "django-formwork",
  "pillow>=11", # ImageField (Ticket.screenshot) needs it
]

[tool.uv.sources]
django-formwork = { path = "../..", editable = true }

[tool.uv]
package = false
