{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>django-formwork example</title>
  <link rel="stylesheet" href="{% static 'dist/styles.css' %}">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body class="min-h-screen bg-base-200 p-8">
  <div class="max-w-xl mx-auto space-y-8">
    <h1 class="text-3xl font-bold">django-formwork example</h1>

    <div class="card bg-base-100 shadow">
      <div class="card-body">
        <h2 class="card-title">Contact Form</h2>
        <form method="post">
          {% csrf_token %}
          {{ contact_form.as_div }}
          <div class="mt-4">
            <button type="submit" class="btn btn-primary">Send</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card bg-base-100 shadow">
      <div class="card-body">
        <h2 class="card-title">Custom Widgets</h2>
        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          {{ showcase_form.as_div }}
          <div class="mt-4">
            <button type="submit" class="btn btn-secondary">Submit</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card bg-base-100 shadow">
      <div class="card-body">
        <h2 class="card-title">All DaisyUI Components</h2>
        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          {{ all_widgets_form.as_div }}
          <div class="mt-4">
            <button type="submit" class="btn btn-accent">Submit</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
