{% load formwork static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Formwork Example{% endblock %}</title>

  <!-- Built CSS (Tailwind + DaisyUI + formwork + icons) -->
  <link rel="stylesheet" href="{% static 'dist.css' %}">

  <!-- htmx 4 for form morphing (innerMorph/outerMorph built into core) -->
  <script src="https://unpkg.com/htmx.org@4.0.0-beta3/dist/htmx.min.js"></script>

  <!-- Alpine.js for interactive widgets -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>

  <!-- Formwork JS (morph configuration) -->
  {% formwork_js %}
</head>
<body class="min-h-screen bg-base-200 p-8">
  <div class="max-w-2xl mx-auto">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
