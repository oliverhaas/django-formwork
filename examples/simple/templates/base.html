{% load formwork %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Formwork Example{% endblock %}</title>

  <!-- DaisyUI + Tailwind CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/full.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@4/index.css" rel="stylesheet">

  <!-- Formwork bridge CSS (adds DaisyUI styling to Django form elements) -->
  {% formwork_css %}

  <!-- htmx for form morphing -->
  <script src="https://unpkg.com/htmx.org@2/dist/htmx.min.js"></script>
  <script src="https://unpkg.com/idiomorph@0.7/dist/idiomorph-ext.min.js"></script>

  <!-- Alpine.js for interactive widgets -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>

  <!-- Formwork JS (morph configuration) -->
  {% formwork_js %}
</head>
<body class="min-h-screen bg-base-200 p-8">
  <div class="max-w-2xl mx-auto">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
