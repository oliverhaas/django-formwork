{% partialdef ticket-form %}
<form id="ticket-form"
      method="post"
      enctype="multipart/form-data"
      hx-encoding="multipart/form-data"
      hx-post="{% url action %}"
      hx-target="#ticket-form"
      hx-swap="outerMorph"
      data-formwork-dirty>
  {% csrf_token %}
  {{ form }}
  <button type="submit" class="btn btn-primary mt-4">Save</button>
</form>
{% endpartialdef %}
